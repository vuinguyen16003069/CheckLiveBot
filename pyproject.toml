[project]
name = "checklivebot"
version = "1.0.0"
description = "Telegram Bot check LIVE/DIE Facebook UID (Single-Process Asyncio, Redis RAM, curl_cffi)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4.0",
    "curl-cffi>=0.7,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "redis>=5.2,<6.0",
    "structlog>=24.4,<26.0",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "~/.cache/ruff/checklivebot"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ",
    "PIE", "PT", "Q", "RSE", "RET", "SIM", "TID", "ARG",
    "PTH", "PERF", "FURB", "LOG", "RUF", "ASYNC", "S",
]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["S101", "S105", "S106", "ARG"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["main.py", "src", "test"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-p", "no:cacheprovider", "--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
testpaths = ["test"]
pythonpath = ["."]
